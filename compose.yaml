name: ${COMPOSE_PROJECT_NAME:-ib-school}

x-app: &app
  image: ib-school-web:${IB_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: deploy/Dockerfile
    target: web
  env_file: .env.deploy
  environment: &app-env
    DJANGO_SETTINGS_MODULE: config.container_settings
    DB_ENGINE: postgresql
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    AUTOQUIZ_OLLAMA_URL: http://ollama:11434
  init: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:size=768m,mode=1777"]
  logging: &logging
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run tools/deploy_env.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Run tools/deploy_env.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run tools/deploy_env.py first}
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  initialize:
    <<: *app
    restart: "no"
    command: [python, deploy/initialize.py]
    volumes: ["media:/app/backend/media", "static:/app/backend/staticfiles"]
    networks: [data]
    depends_on:
      db: {condition: service_healthy}

  web:
    <<: *app
    volumes: ["media:/app/backend/media", "static:/app/backend/staticfiles:ro"]
    networks: [data, front, ai]
    depends_on:
      initialize: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Run tools/deploy_env.py first}
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - "./deploy/${CADDY_CONFIG:-Caddyfile}:/etc/caddy/Caddyfile:ro"
      - "static:/srv/static:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    networks: [front, outbound]
    depends_on:
      web: {condition: service_healthy}
    logging: *logging

  ollama:
    image: ollama/ollama:0.34.0
    profiles: [ai]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes: ["ollama_models:/root/.ollama"]
    networks: [ai, outbound]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *logging

  autoquiz:
    <<: *app
    image: ib-school-autoquiz:${IB_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: autoquiz
    profiles: [ai]
    volumes: ["media:/app/backend/media:ro", "whisper_models:/app/.autoquiz_models"]
    networks: [data, ai, outbound]
    depends_on:
      initialize: {condition: service_completed_successfully}
      ollama: {condition: service_healthy}
    stop_grace_period: 30s

  judge:
    <<: *app
    image: ib-school-judge:${IB_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: judge
    profiles: [cpp]
    environment:
      <<: *app-env
      DOCKER_HOST: ${JUDGE_DOCKER_HOST:-ssh://judge@runner.invalid}
    volumes:
      - type: bind
        source: ./deploy/secrets/judge
        target: /home/app/.ssh
        read_only: true
        bind: {create_host_path: false}
    networks: [data, outbound]
    depends_on:
      initialize: {condition: service_completed_successfully}

networks:
  data: {internal: true}
  front: {internal: true}
  ai: {internal: true}
  outbound: {}

volumes:
  database: {}
  media: {}
  static: {}
  caddy_data: {}
  caddy_config: {}
  ollama_models: {}
  whisper_models: {}
