{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ИБ{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/foundation.css' %}">
</head>
<body class="auth-body">
    <div class="auth-shell">
        <section class="auth-visual">
            <a class="auth-brand" href="{% url 'login' %}">
                <span class="brand__mark">
                    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4 39 10v11c0 10-6 18-15 23C15 39 9 31 9 21V10L24 4Z"/><path d="M18 14v17M24 12v22M30 14v17"/></svg>
                </span>
                <strong>ИБ</strong>
            </a>
            <div class="auth-visual__copy">
                <span class="eyebrow eyebrow--light">Обучающая платформа</span>
                <h1>Разобраться.<br>Попробовать.<br>Научиться.</h1>
                <p>Курсы, практика, тесты и честный рейтинг знаний в одном месте.</p>
            </div>
            <div class="auth-visual__grid" aria-hidden="true"></div>
        </section>
        <section class="auth-panel">
            <div class="auth-card">
                {% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}
            </div>
        </section>
    </div>
<script src="{% static 'js/foundation.js' %}" defer></script>
</body>
</html>
