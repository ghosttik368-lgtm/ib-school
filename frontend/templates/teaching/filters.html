<label>Группа<select name="group"><option value="">Все студенты</option>{% for group in groups %}<option value="{{ group.id }}" {% if request.GET.group == group.id|stringformat:'s' %}selected{% endif %}>{{ group.title }}{% if group.archived %} · архив{% endif %}</option>{% endfor %}</select></label>
<label>Курс<select name="course"><option value="">Все мои курсы</option>{% for course in courses %}<option value="{{ course.id }}" {% if request.GET.course == course.id|stringformat:'s' %}selected{% endif %}>{{ course.title }} · #{{ course.id }}</option>{% endfor %}</select></label>
