name: Verify platform
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/init_local.py
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test access studio learning practice messenger teaching autoquiz accounts.tests_issuance config.tests_deployment --noinput
        env:
          DEV_DISABLE_MFA: '0'
      - run: python tools/test_platform.py
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/deploy_env.py --mode local --ai on --cpp on
      - run: python tools/dc.py config --quiet
      - run: python tools/dc.py build web judge-local autoquiz
      - run: docker build -t ib-cpp-runner:m34 runner
      - run: python tools/dc.py up -d db initialize web proxy
      - run: python tools/dc.py run --rm --no-deps -T judge-local python backend/manage.py check_runner
      - run: python tools/dc.py run --rm --no-deps -T autoquiz python -c "import faster_whisper, ctranslate2, av; print('AI dependencies OK')"
      - run: python tools/dc.py run --rm --no-deps -T web python backend/manage.py test accounts.tests_issuance --noinput
      - name: HTTP health
        run: curl --fail --retry 20 --retry-delay 2 --retry-connrefused http://localhost:8080/healthz/
      - name: Logs
        if: failure()
        run: python tools/dc.py logs --tail 100
      - name: Remove CI-only containers
        if: always()
        run: python tools/dc.py down -v
