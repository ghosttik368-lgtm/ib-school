name: Verify platform
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/init_local.py
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test access studio learning practice messenger teaching autoquiz accounts.tests_issuance config.tests_deployment --noinput
        env:
          DEV_DISABLE_MFA: '0'
      - run: python tools/test_platform.py
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh compose.sh init
      - run: sh compose.sh config --quiet
      - run: sh compose.sh up -d --build
      - run: sh compose.sh exec -T judge-local python backend/manage.py check_runner
      - name: AI is absent
        run: |
          test -z "$(sh compose.sh ps --services --status running | grep -E '^(autoquiz|ollama)$' || true)"
          sh compose.sh exec -T web python -c "import importlib.util; assert importlib.util.find_spec('faster_whisper') is None"
      - run: python tools/dc.py run --rm --no-deps -T web python backend/manage.py test accounts.tests_issuance --noinput
      - name: Docker-only backup
        run: sh compose.sh backup
      - name: HTTP health
        run: curl --fail --retry 20 --retry-delay 2 --retry-connrefused http://localhost:8080/healthz/
      - name: Logs
        if: failure()
        run: python tools/dc.py logs --tail 100
      - name: Remove CI-only containers
        if: always()
        run: python tools/dc.py down -v
