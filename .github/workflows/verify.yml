name: Verify platform
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/init_local.py
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test access studio learning practice messenger teaching autoquiz accounts.tests_issuance config.tests_deployment --noinput
        env:
          DEV_DISABLE_MFA: '0'
      - run: python tools/test_platform.py
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh compose.sh init
      - run: sh compose.sh config --quiet
      - run: sh compose.sh up -d --build
      - run: sh compose.sh exec -T judge-local python backend/manage.py check_runner --repeat 20
      - name: AI is absent
        run: |
          test -z "$(sh compose.sh ps --services --status running | grep -E '^(autoquiz|ollama)$' || true)"
          sh compose.sh exec -T web python -c "import importlib.util; assert importlib.util.find_spec('faster_whisper') is None"
      - run: python tools/dc.py run --rm --no-deps -T web python backend/manage.py test accounts.tests_issuance practice --noinput
      - name: Docker-only backup
        run: sh compose.sh backup
      - name: HTTP health
        run: curl --fail --retry 20 --retry-delay 2 --retry-connrefused http://localhost:8080/healthz/
      - name: Logs
        if: failure()
        run: python tools/dc.py logs --tail 100
      - name: Remove CI-only containers
        if: always()
        run: python tools/dc.py down -v
  onebox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate default and optional AI configuration
        run: |
          test ! -f .env.deploy
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.ai.yaml config --quiet
          python deploy/onebox/test_bootstrap.py
      - name: Start everything with one command
        run: docker compose up -d --build
      - name: Verify website and real C++
        run: |
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://localhost/healthz/
          docker compose exec -T judge python backend/manage.py check_runner --repeat 20
          docker compose exec -T web python backend/manage.py test practice accounts.tests_issuance --noinput
      - name: Restart preserves private settings and existing accounts
        run: |
          docker compose exec -T web sha256sum /run/ib/settings.json > /tmp/config-before
          docker compose exec -T web python backend/manage.py shell -c "from accounts.models import User; assert User.objects.filter(username='admin', is_superuser=True).count()==1"
          docker compose up -d --build
          docker compose exec -T web sha256sum /run/ib/settings.json > /tmp/config-after
          diff /tmp/config-before /tmp/config-after
          docker compose exec -T web python backend/manage.py shell -c "from accounts.models import User; assert User.objects.count()==1"
          docker compose exec -T judge python backend/manage.py check_runner --repeat 3
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Remove disposable CI data
        if: always()
        run: docker compose down -v --remove-orphans
