# Optional: docker compose -f compose.yaml -f compose.ai.yaml up -d --build
services:
  web:
    environment:
      AUTOQUIZ_ENABLED: "1"
  initialize:
    environment:
      AUTOQUIZ_ENABLED: "1"
  ollama:
    image: ollama/ollama:0.34.0
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes: ["ollama_models:/root/.ollama"]
    networks: [ai, outbound]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 30
  ai-prepare:
    image: ib-school-autoquiz:${IB_IMAGE_TAG:-local}
    build: {context: ., dockerfile: deploy/Dockerfile, target: autoquiz}
    restart: on-failure
    command: [python, deploy/onebox/prepare_ai.py]
    environment: &ai-env
      DJANGO_SETTINGS_MODULE: config.onebox_settings
      AUTOQUIZ_ENABLED: "1"
    volumes: ["runtime:/run/ib:ro", "whisper_models:/app/.autoquiz_models"]
    networks: [data, ai, outbound]
    depends_on:
      initialize: {condition: service_completed_successfully}
      ollama: {condition: service_healthy}
  autoquiz:
    image: ib-school-autoquiz:${IB_IMAGE_TAG:-local}
    build: {context: ., dockerfile: deploy/Dockerfile, target: autoquiz}
    restart: unless-stopped
    init: true
    environment: *ai-env
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=768m,mode=1777"]
    volumes: ["runtime:/run/ib:ro", "media:/app/backend/media:ro", "whisper_models:/app/.autoquiz_models"]
    networks: [data, ai]
    depends_on:
      ai-prepare: {condition: service_completed_successfully}
volumes:
  ollama_models: {}
  whisper_models: {}
